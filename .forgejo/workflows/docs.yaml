name: Build documentation

on:
  push:
    branches: [main, dev, docs-update]
    paths:
      - "apps/docs/**"
      - ".forgejo/workflows/docs.yaml"
  pull_request:
    paths:
      - "apps/docs/**"
      - ".forgejo/workflows/docs.yaml"
  workflow_dispatch:

jobs:
  build:
    name: Build MkDocs site
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/docs/requirements.txt

      - name: Sync documentation assets
        run: |
          mkdir -p apps/docs/src/assets/logos
          for f in square.png withText-white.png; do
            if [ -f ".github/assets/logos/$f" ]; then
              cp ".github/assets/logos/$f" apps/docs/src/assets/logos/
            fi
          done

      - name: Build documentation
        run: |
          cd apps/docs
          mkdocs build --strict

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: apps/docs/site
          if-no-files-found: error

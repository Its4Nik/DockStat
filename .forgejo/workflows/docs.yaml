name: Build documentation

on:
  push:
    branches: [main, dev, docs-update]
    paths:
      - "apps/docs/**"
      - ".forgejo/workflows/docs.yaml"
  pull_request:
    paths:
      - "apps/docs/**"
      - ".forgejo/workflows/docs.yaml"
  workflow_dispatch:

jobs:
  build:
    name: Build MkDocs site
    runs-on: self-hosted-uv
    steps:
      - name: Checkout repository
        run: |
          git clone https://${{ forgejo.token }}@data.forgejo.org/${{ forgejo.repository.full_name }}.git .
          git checkout ${{ forgejo.sha }}

      - name: Set up Python
        run: |
          cd apps/docs
          uv venv .venv
          uv pip install -e .

      - name: Sync documentation assets
        run: |
          mkdir -p apps/docs/src/assets/logos
          for f in square.png withText-white.png; do
            if [ -f ".github/assets/logos/$f" ]; then
              cp ".github/assets/logos/$f" apps/docs/src/assets/logos/
            fi
          done

      - name: Build documentation
        run: |
          mkdocs build --strict

      - uses: actions/git-pages@v2
        with:
          #site: https://dockstat.itsnik.de/
          site: https://${{ forgejo.event.repository.owner.username }}.codeberg.page/dockstat
          server: codeberg.page
          token: ${{ forgejo.token }}
          source: apps/docs/site/
